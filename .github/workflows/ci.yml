name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: candleflow
          POSTGRES_PASSWORD: candleflow
          POSTGRES_DB: candleflow_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U candleflow -d candleflow_test"
          --health-interval 2s --health-timeout 3s --health-retries 25
    env:
      TEST_DATABASE_URL: postgresql+psycopg://candleflow:candleflow@localhost:5432/candleflow_test
      DATABASE_URL: postgresql+psycopg://candleflow:candleflow@localhost:5432/candleflow_test
      # Tests use the offline fake provider; no API key is ever needed in CI.
      AI_PROVIDER: fake
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: pip install '.[dev]'
      - name: Ruff
        run: |
          ruff check .
          ruff format --check .
      - name: Pytest on PostgreSQL
        run: python -m pytest -q
      - name: Models match migrations
        run: alembic check

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build

  compose:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Compose file is valid
        run: docker compose config --quiet
