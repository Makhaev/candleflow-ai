[project]
name = "candleflow"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1", "anyio>=4,<5", "uvicorn>=0.34,<1", "sqlalchemy[asyncio]>=2.0,<3",
  "psycopg[binary]>=3.2,<4", "asyncpg>=0.30,<1", "alembic>=1.14,<2", "pydantic-settings>=2.7,<3",
  "celery[redis]>=5.4,<6", "openai>=2,<3", "httpx>=0.27,<1",
  "python-multipart>=0.0.20,<1", "openpyxl>=3.1,<4",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.9,<1"]

[tool.setuptools.packages.find]
include = ["candleflow*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 110
