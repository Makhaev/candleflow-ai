server {
    listen 80;
    root /usr/share/nginx/html;
    server_tokens off;
    client_max_body_size 3m;

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json image/svg+xml;

    location /api/ {
        # Query strings can contain supplier names, so requests are not logged here;
        # the API writes its own access log without query strings.
        access_log off;
        proxy_pass http://api:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # SSE: stream assistant tokens without buffering.
        proxy_buffering off;
        proxy_read_timeout 420s;
        add_header X-Content-Type-Options nosniff always;
    }

    location ~ ^/(docs|openapi\.json)$ {
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
    }

    # Vite puts a content hash in asset names, so they can be cached forever.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options nosniff always;
    }

    location / {
        try_files $uri /index.html;
        # index.html must be revalidated so a new release is picked up at once.
        add_header Cache-Control "no-cache";
        add_header Content-Security-Policy "default-src 'self'; img-src 'self' data: blob:; style-src 'self'; script-src 'self'; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy same-origin always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    }
}
