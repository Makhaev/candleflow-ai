server {
    listen 80;
    root /usr/share/nginx/html;
    client_max_body_size 3m;
    location /api/ {
        proxy_pass http://api:8000;
        proxy_http_version 1.1;
        proxy_buffering off;
        proxy_read_timeout 420s;
    }
    location ~ ^/(docs|openapi\.json)$ {
        proxy_pass http://api:8000;
    }
    location / {
        try_files $uri /index.html;
    }
}
